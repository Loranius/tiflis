name: Harden registration

on:
  push:
    branches:
      - feature/self-registration-reset-dashboard-v1

permissions:
  contents: write

concurrency:
  group: harden-registration
  cancel-in-progress: true

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/self-registration-reset-dashboard-v1
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Harden registration logic
        run: python .github/scripts/harden_registration.py
      - name: Check registration API
        run: deno check --node-modules-dir=auto supabase/functions/tiflis-registration-api/index.ts
      - name: Check login API
        run: deno check --node-modules-dir=auto supabase/functions/tiflis-auth-migrate/index.ts
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Bundle budget
        run: npm run perf:budget
      - name: Commit hardened result
        run: |
          rm .github/workflows/harden-registration.yml
          rm .github/scripts/harden_registration.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add supabase/functions/tiflis-registration-api/index.ts supabase/functions/tiflis-auth-migrate/index.ts .github/workflows/harden-registration.yml .github/scripts/harden_registration.py
          git commit -m "Harden exact login matching and approval rollback"
          git push origin HEAD:feature/self-registration-reset-dashboard-v1
