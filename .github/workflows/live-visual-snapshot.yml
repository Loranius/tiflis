name: Tiflis Live Visual Snapshot

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/live-visual-snapshot.yml'

permissions:
  contents: write

concurrency:
  group: tiflis-live-visual-snapshot
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install visual MCP dependencies
        run: npm --prefix tools/tiflis-visual-mcp install --no-fund --no-audit

      - name: Install Chromium
        run: npm --prefix tools/tiflis-visual-mcp run install:browser -- --with-deps

      - name: Capture Pixel 8 Pro viewport
        working-directory: tools/tiflis-visual-mcp
        run: |
          mkdir -p ../../visual-reports
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import { writeFile } from 'node:fs/promises';

          const target = 'https://loranius.github.io/tiflis/';
          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({
            viewport: { width: 448, height: 998 },
            deviceScaleFactor: 1,
            isMobile: true,
            hasTouch: true,
            locale: 'uk-UA',
            colorScheme: 'dark',
            reducedMotion: 'reduce',
          });
          const page = await context.newPage();
          const consoleErrors = [];
          page.on('console', message => {
            if (message.type() === 'error') consoleErrors.push(message.text());
          });
          page.on('pageerror', error => consoleErrors.push(error.message));

          const response = await page.goto(target, { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForLoadState('networkidle', { timeout: 30000 }).catch(() => {});
          await page.waitForTimeout(4000);

          await page.screenshot({
            path: '../../visual-reports/latest-pixel8pro.jpg',
            type: 'jpeg',
            quality: 88,
            fullPage: false,
          });

          const metadata = {
            capturedAt: new Date().toISOString(),
            requestedUrl: target,
            finalUrl: page.url(),
            title: await page.title(),
            httpStatus: response?.status() ?? null,
            viewport: { width: 448, height: 998 },
            consoleErrors: consoleErrors.slice(0, 30),
          };
          await writeFile('../../visual-reports/latest-pixel8pro.json', JSON.stringify(metadata, null, 2));
          await browser.close();
          NODE

      - name: Commit latest snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add visual-reports/latest-pixel8pro.jpg visual-reports/latest-pixel8pro.json
          if git diff --cached --quiet; then
            echo 'Snapshot unchanged.'
            exit 0
          fi
          git commit -m 'chore: refresh live visual snapshot [skip ci]'
          git push
