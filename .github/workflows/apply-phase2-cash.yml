name: Apply Phase 2 cash patch

on:
  push:
    branches:
      - fix/cash-private-leaderboard-20260805

permissions:
  contents: write

concurrency:
  group: phase2-cash-patch
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[phase2-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v6
        with:
          ref: fix/cash-private-leaderboard-20260805

      - name: Apply exact source patch
        run: node scripts/apply-phase2-cash.mjs

      - name: Commit patched implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/CashPage.tsx supabase/functions/tiflis-secure-api/index.ts
          git commit -m "feat: private interactive cash leaderboard [phase2-applied]"
          git push origin HEAD:fix/cash-private-leaderboard-20260805
