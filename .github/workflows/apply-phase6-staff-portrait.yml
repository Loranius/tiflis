name: Apply Phase 6 staff portrait patch

on:
  push:
    branches:
      - fix/staff-fullscreen-portrait-20260805

permissions:
  contents: write

concurrency:
  group: phase6-staff-portrait-patch
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[phase6-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v6
        with:
          ref: fix/staff-fullscreen-portrait-20260805

      - name: Apply exact source patch
        run: node scripts/apply-phase6-staff-portrait.mjs

      - name: Commit patched source files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/StaffPage.tsx src/pages/staff.css
          git commit -m "feat: add fullscreen staff portrait and credo [phase6-applied]"
          git push origin HEAD:fix/staff-fullscreen-portrait-20260805
