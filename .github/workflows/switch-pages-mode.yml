name: Switch Pages to workflow mode

on:
  push:
    branches:
      - fix/stable-pages-deploy-final
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  switch:
    runs-on: ubuntu-latest
    steps:
      - name: Switch Pages build type
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl --silent --show-error --output response.txt --write-out '%{http_code}' \
            --request PUT \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            --data '{"build_type":"workflow"}')
          cat response.txt
          test "$status" = '204'
