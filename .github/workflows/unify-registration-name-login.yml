name: Apply unified registration name and login

on:
  push:
    branches:
      - feature/unified-registration-name-login

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/unified-registration-name-login
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Apply registration changes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str):
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f'Missing expected block in {path}: {old[:120]!r}')
              file.write_text(text.replace(old, new))

          replace('src/pages/LoginPage.tsx', "  const [displayName, setDisplayName] = useState('');\n", '')
          replace(
              'src/pages/LoginPage.tsx',
              "      const response = await registerPortalUser({\n        displayName: displayName.trim(),\n        login: loginValue.trim(),\n        password,\n        passwordConfirm,\n      });",
              "      const response = await registerPortalUser({\n        login: loginValue.trim(),\n        password,\n        passwordConfirm,\n      });",
          )
          replace(
              'src/pages/LoginPage.tsx',
              "                ? 'Створи логін і пароль. Доступ відкриється після підтвердження адміністратора.'",
              "                ? 'Введи ім’я, яке одночасно буде твоїм логіном для входу. Доступ відкриється після підтвердження адміністратора.'",
          )
          replace(
              'src/pages/LoginPage.tsx',
              "              <AuthField label=\"Ім’я в порталі\" icon={<UserRound size={18} />}><input autoComplete=\"name\" value={displayName} onChange={(event) => setDisplayName(event.target.value)} placeholder=\"Наприклад, Дмитро\" minLength={2} maxLength={120} required /></AuthField>\n              <AuthField label=\"Логін для входу\" icon={<KeyRound size={18} />}><input autoComplete=\"username\" value={loginValue} onChange={(event) => setLoginValue(event.target.value)} placeholder=\"Літери, цифри, крапка або _\" minLength={2} maxLength={40} required /></AuthField>",
              "              <AuthField label=\"Ім’я / логін\" icon={<UserRound size={18} />}><input autoComplete=\"username\" value={loginValue} onChange={(event) => setLoginValue(event.target.value)} placeholder=\"Наприклад, Дмитро або Анна Марія\" minLength={2} maxLength={40} required /></AuthField>\n              <p className=\"auth-field-hint-v4\">Це ім’я відображатиметься в порталі й використовуватиметься для входу.</p>",
          )

          replace(
              'src/lib/publicAuthApi.ts',
              "export function registerPortalUser(input: {\n  displayName: string;\n  login: string;\n  password: string;\n  passwordConfirm: string;\n}) {\n  return request({\n    action: 'register',\n    display_name: input.displayName,\n    login: input.login,",
              "export function registerPortalUser(input: {\n  login: string;\n  password: string;\n  passwordConfirm: string;\n}) {\n  return request({\n    action: 'register',\n    display_name: input.login,\n    login: input.login,",
          )

          replace(
              'supabase/functions/tiflis-registration-api/index.ts',
              'function cleanLogin(value: unknown): string {\n  return cleanText(value, 40).normalize("NFKC");\n}\n\nfunction validLogin(value: string): boolean {\n  return /^[\\p{L}\\p{N}._-]{2,40}$/u.test(value);\n}',
              'function cleanLogin(value: unknown): string {\n  return cleanText(value, 40).normalize("NFKC").replace(/\\s+/g, " ");\n}\n\nfunction validLogin(value: string): boolean {\n  return /^(?=.{2,40}$)[\\p{L}\\p{N}._-]+(?: [\\p{L}\\p{N}._-]+)*$/u.test(value);\n}',
          )
          replace('supabase/functions/tiflis-registration-api/index.ts', 'async function notifyAdmins(displayName: string, login: string): Promise<void> {', 'async function notifyAdmins(login: string): Promise<void> {')
          replace(
              'supabase/functions/tiflis-registration-api/index.ts',
              '    `Ім’я: <b>${displayName.replaceAll("<", "&lt;").replaceAll(">", "&gt;")}</b>`,\n    `Логін: <code>${login.replaceAll("<", "&lt;").replaceAll(">", "&gt;")}</code>`,',
              '    `Ім’я / логін: <b>${login.replaceAll("<", "&lt;").replaceAll(">", "&gt;")}</b>`,',
          )
          replace(
              'supabase/functions/tiflis-registration-api/index.ts',
              '      const displayName = cleanText(body.display_name, 120);\n      const login = cleanLogin(body.login);',
              '      const login = cleanLogin(body.login);\n      const displayName = login;',
          )
          replace(
              'supabase/functions/tiflis-registration-api/index.ts',
              '      if (!displayName || !validLogin(login) || !validPassword(password) || password !== confirmation) {\n        return json(req, { ok: false, error: "Перевірте ім’я, логін і пароль. Пароль має містити щонайменше 8 символів, літеру та цифру." }, 400);',
              '      if (!validLogin(login) || !validPassword(password) || password !== confirmation) {\n        return json(req, { ok: false, error: "Перевірте ім’я / логін і пароль. Пароль має містити щонайменше 8 символів, літеру та цифру." }, 400);',
          )
          replace('supabase/functions/tiflis-registration-api/index.ts', '      await notifyAdmins(displayName, login);', '      await notifyAdmins(login);')

          replace(
              'src/components/RegistrationAdminPanel.tsx',
              '<div><strong>{item.display_name}</strong><small>Логін: {item.login} · {formatDate(item.requested_at)}</small></div>',
              '<div><strong>{item.display_name}</strong><small>{item.display_name === item.login ? \'Ім’я та логін\' : `Логін: ${item.login}`} · {formatDate(item.requested_at)}</small></div>',
          )
          replace(
              'src/components/RegistrationAdminPanel.tsx',
              '<small>{item.login} · {item.decided_by || \'Адміністратор\'} · {formatDate(item.decided_at)}</small>',
              '<small>{item.display_name === item.login ? \'Ім’я та логін збігаються\' : `Логін: ${item.login}`} · {item.decided_by || \'Адміністратор\'} · {formatDate(item.decided_at)}</small>',
          )

          css = Path('src/pages/auth-flow.css')
          css.write_text(css.read_text() + "\n.auth-field-hint-v4{margin:-6px 2px 0;color:#6f7b73;font-size:.82rem;line-height:1.45}\n")

          replace(
              '.github/workflows/ci.yml',
              '      - name: Check duty planner Edge Function\n        run: deno check --node-modules-dir=auto supabase/functions/tiflis-duty-planner-api/index.ts\n',
              '      - name: Check Edge Functions\n        run: |\n          deno check --node-modules-dir=auto supabase/functions/tiflis-duty-planner-api/index.ts\n          deno check --node-modules-dir=auto supabase/functions/tiflis-registration-api/index.ts\n          deno check --node-modules-dir=auto supabase/functions/tiflis-auth-migrate/index.ts\n',
          )
          PY

      - name: Install dependencies
        run: npm install

      - name: Check Edge Functions
        run: |
          deno check --node-modules-dir=auto supabase/functions/tiflis-duty-planner-api/index.ts
          deno check --node-modules-dir=auto supabase/functions/tiflis-registration-api/index.ts
          deno check --node-modules-dir=auto supabase/functions/tiflis-auth-migrate/index.ts

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Bundle budget
        run: npm run perf:budget

      - name: Commit verified changes
        run: |
          rm .github/workflows/unify-registration-name-login.yml
          git config user.name Loranius
          git config user.email 72103663+Loranius@users.noreply.github.com
          git add src/pages/LoginPage.tsx src/pages/auth-flow.css src/lib/publicAuthApi.ts src/components/RegistrationAdminPanel.tsx supabase/functions/tiflis-registration-api/index.ts .github/workflows/ci.yml .github/workflows/unify-registration-name-login.yml
          git commit -m "Use one name as registration login"
          git push origin HEAD:feature/unified-registration-name-login
