name: Apply practical typecheck fix

on:
  push:
    branches:
      - fix/cash-dashboard-practical-20260805

permissions:
  contents: write

concurrency:
  group: apply-practical-typecheck-fix
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/cash-dashboard-practical-20260805
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Apply exact patch
        run: node scripts/fix-practical-typecheck.mjs
      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/CashPage.tsx src/pages/DashboardPage.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Fix practical portal typecheck"
          git push origin HEAD:fix/cash-dashboard-practical-20260805
