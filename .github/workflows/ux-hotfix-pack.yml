name: UX hotfix pack

on:
  push:
    branches:
      - ux/cash-schedule-menu-favicon

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ux/cash-schedule-menu-favicon
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Apply UX changes
        run: python .github/scripts/apply_ux_hotfix.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Commit generated fixes
        run: |
          rm .github/workflows/ux-hotfix-pack.yml
          rm .github/scripts/apply_ux_hotfix.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/pages/CashPage.tsx src/pages/cash.css src/pages/SchedulePage.tsx src/pages/schedule.css src/pages/MenuPage.tsx src/pages/menu.css index.html .github/workflows/ux-hotfix-pack.yml .github/scripts/apply_ux_hotfix.py
          git commit -m "Improve cash entry, schedule picker, menu photos and favicon"
          git push origin HEAD:ux/cash-schedule-menu-favicon
