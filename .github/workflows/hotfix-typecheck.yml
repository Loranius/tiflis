name: Hotfix Typecheck

on:
  push:
    branches:
      - fix/typecheck-cleanup

permissions:
  contents: write

jobs:
  fix-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[typecheck-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v6
        with:
          ref: fix/typecheck-cleanup

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Apply deterministic fixes
        shell: python
        run: |
          from pathlib import Path

          operations = Path('src/components/OperationsDashboard.tsx')
          text = operations.read_text()
          old = '  Clock3,\n'
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one Clock3 import, found {text.count(old)}')
          operations.write_text(text.replace(old, '', 1))

          admin = Path('src/pages/AdminPage.tsx')
          text = admin.read_text()
          replacements = {
              "!loading && config && tab === 'notice'": "!loading && data && config && tab === 'notice'",
              "!loading && config && tab === 'system'": "!loading && data && config && tab === 'system'",
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'Expected exactly one occurrence of {old!r}, found {text.count(old)}')
              text = text.replace(old, new, 1)
          admin.write_text(text)

          staff = Path('src/pages/StaffPage.tsx')
          text = staff.read_text()
          old_import = '  Instagram,\n'
          old_usage = '<Instagram size={15} />'
          if text.count(old_import) != 1:
              raise SystemExit(f'Expected exactly one Instagram import, found {text.count(old_import)}')
          if text.count(old_usage) != 1:
              raise SystemExit(f'Expected exactly one Instagram usage, found {text.count(old_usage)}')
          text = text.replace(old_import, '', 1)
          text = text.replace(old_usage, '<span aria-hidden="true">IG</span>', 1)
          staff.write_text(text)

      - name: Install dependencies
        run: npm install

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Commit verified hotfix
        run: |
          rm .github/workflows/hotfix-typecheck.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: resolve strict TypeScript failures [typecheck-fixed]'
          git push origin HEAD:fix/typecheck-cleanup
