name: Tiflis v2 CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tiflis-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
  VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
  VITE_BUILD_ID: ${{ github.sha }}

jobs:
  build:
    name: Validate production portal
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-fund

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check duty planner Edge Function
        run: deno check --node-modules-dir=auto supabase/functions/tiflis-duty-planner-api/index.ts

      - name: Check secure API Edge Function
        run: deno check --node-modules-dir=auto supabase/functions/tiflis-secure-api/index.ts

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Build production artifact
        run: npm run build

      - name: Check bundle performance budget
        run: npm run perf:budget

      - name: Smoke-test built portal
        run: npm run smoke:dist
