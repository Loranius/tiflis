name: Registration reset dashboard

on:
  push:
    branches:
      - feature/self-registration-reset-dashboard-v1

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/self-registration-reset-dashboard-v1
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Apply admin and auth wiring
        run: python .github/scripts/apply_registration_wiring.py
      - name: Check registration API
        run: deno check --node-modules-dir=auto supabase/functions/tiflis-registration-api/index.ts
      - name: Check login API
        run: deno check --node-modules-dir=auto supabase/functions/tiflis-auth-migrate/index.ts
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Bundle budget
        run: npm run perf:budget
      - name: Commit generated wiring
        run: |
          rm .github/workflows/registration-reset-dashboard.yml
          rm .github/scripts/apply_registration_wiring.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/pages/AdminPage.tsx supabase/functions/tiflis-auth-migrate/index.ts .github/workflows/registration-reset-dashboard.yml .github/scripts/apply_registration_wiring.py
          git commit -m "Wire registration approvals and pending login status"
          git push origin HEAD:feature/self-registration-reset-dashboard-v1
