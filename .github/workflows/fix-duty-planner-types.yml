name: Repair duty planner types

on:
  push:
    branches:
      - feature/schedule-duty-zone-planner

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/schedule-duty-zone-planner
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Repair strict Deno types
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('supabase/functions/tiflis-duty-planner-api/index.ts')
          text = path.read_text()
          replacements = {
              'service: ReturnType<typeof createClient>,': 'service: any,',
              'const allowedDutyKeys = new Set(dutyDefinitions(type).map((item) => item.key));': 'const allowedDutyKeys = new Set<string>(dutyDefinitions(type).map((item) => item.key));',
              'const allowedZoneKeys = new Set(DAILY_ZONES.map((item) => item.key));': 'const allowedZoneKeys = new Set<string>(DAILY_ZONES.map((item) => item.key));',
              'const dutyMap = new Map(dutyDefinitions(type).map((item) => [item.key, item.title]));': 'const dutyMap = new Map<string, string>(dutyDefinitions(type).map((item) => [item.key, item.title]));',
              'const zoneMap = new Map(DAILY_ZONES.map((item) => [item.key, item.title]));': 'const zoneMap = new Map<string, string>(DAILY_ZONES.map((item) => [item.key, item.title]));',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing expected pattern: {old}')
              text = text.replace(old, new)
          path.write_text(text)
          PY
      - name: Install dependencies
        run: npm install
      - name: Check Edge Function
        run: deno check --node-modules-dir=auto supabase/functions/tiflis-duty-planner-api/index.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Bundle budget
        run: npm run perf:budget
      - name: Commit repaired code
        run: |
          rm .github/workflows/fix-duty-planner-types.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add supabase/functions/tiflis-duty-planner-api/index.ts .github/workflows/fix-duty-planner-types.yml
          git commit -m "Fix strict types in duty planner API"
          git push origin HEAD:feature/schedule-duty-zone-planner
