name: Temporary Staff Import Organizer

on:
  push:
    branches:
      - feature/staff-v1

permissions:
  contents: write

jobs:
  organize:
    if: ${{ !contains(github.event.head_commit.message, '[skip organize]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/staff-v1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: node scripts/organize-staff-imports.mjs
      - name: Commit result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/pages/StaffPage.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore(staff): organize imports [skip organize]'
          git push origin HEAD:feature/staff-v1
