    <style>
      html,body{min-height:100%;margin:0;background:#161514;color:#f2eee5}
      #root{min-height:100dvh}
      #boot-recovery{position:fixed;inset:0;z-index:99999;min-height:100dvh;display:grid;place-items:center;padding:24px;background:#161514;color:#f2eee5;font-family:system-ui,sans-serif;text-align:center;box-sizing:border-box}
      #boot-recovery[hidden]{display:none}
      #boot-recovery>div{width:min(100%,420px);display:grid;justify-items:center;gap:13px;padding:28px 24px;border:1px solid rgba(244,238,226,.12);border-radius:24px;background:#201f1e;box-shadow:0 30px 90px rgba(0,0,0,.4);box-sizing:border-box}
      #boot-recovery .boot-mark{width:64px;height:64px;display:grid;place-items:center;border:1px solid rgba(244,238,226,.12);border-radius:21px;background:#2b2a29;color:#d1b46b;overflow:hidden}
      #boot-recovery strong{font-size:23px;color:#f4f0e8}
      #boot-recovery span{color:#ada79c;line-height:1.55}
      #boot-recovery .boot-loader{width:34px;height:34px;margin-top:3px;border:3px solid rgba(209,180,107,.15);border-top-color:#d1b46b;border-radius:50%;animation:boot-spin .8s linear infinite}
      #boot-recovery button{display:none;min-height:46px;width:100%;margin-top:3px;border:0;border-radius:13px;background:#d1b46b;color:#1a1918;font:inherit;font-weight:700;cursor:pointer}
      #boot-recovery[data-state="error"] .boot-loader{display:none}
      #boot-recovery[data-state="error"] button{display:block}
      @keyframes boot-spin{to{transform:rotate(360deg)}}
    </style>
    <script>
      (() => {
        const rawBuildId = '__TIFLIS_BUILD_ID__';
        const buildId = rawBuildId.startsWith('__TIFLIS_') ? 'stable-runtime' : rawBuildId;
        const recoveryKey = `tiflis.asset-recovery.${buildId}`;
        let appStarted = false;

        function portalWorker(registration) {
          const worker = registration.active || registration.waiting || registration.installing;
          const scriptUrl = worker && worker.scriptURL ? worker.scriptURL : '';
          if (!scriptUrl) return false;
          const expected = new URL('./sw.js', document.baseURI).href;
          try {
            return scriptUrl === expected || new URL(scriptUrl).pathname.endsWith('/tiflis/sw.js');
          } catch (_) {
            return false;
          }
        }

        window.__TIFLIS_APP_STARTED__ = () => {
          appStarted = true;
          const recovery = document.getElementById('boot-recovery');
          if (recovery) recovery.hidden = true;
        };

        async function clearPortalRuntime() {
          try {
            if ('serviceWorker' in navigator) {
              const registrations = await navigator.serviceWorker.getRegistrations();
              await Promise.allSettled(registrations.filter(portalWorker).map((registration) => registration.unregister()));
            }
          } catch (_) {}

          try {
            if ('caches' in window) {
              const keys = await caches.keys();
              await Promise.allSettled(keys.filter((key) => key.toLowerCase().startsWith('tiflis')).map((key) => caches.delete(key)));
            }
          } catch (_) {}
        }

        async function recoverOnce() {
          let alreadyRecovered = false;
          try { alreadyRecovered = sessionStorage.getItem(recoveryKey) === '1'; } catch (_) {}
          if (alreadyRecovered) return false;
          try { sessionStorage.setItem(recoveryKey, '1'); } catch (_) {}
          await clearPortalRuntime();
          const url = new URL(location.href);
          url.searchParams.set('runtime', `${buildId}-${Date.now()}`);
          location.replace(url.toString());
          return true;
        }

        function showRecoveryError() {
          const recovery = document.getElementById('boot-recovery');
          if (!recovery) return;
          recovery.dataset.state = 'error';
          const title = recovery.querySelector('strong');
          const message = recovery.querySelector('.boot-message');
          if (title) title.textContent = 'Портал не завантажився';
          if (message) message.textContent = 'Застарілий кеш уже очищено. Перезапустіть робочу версію порталу.';
        }

        window.addEventListener('error', (event) => {
          const target = event.target;
          const assetFailed = target instanceof HTMLScriptElement || target instanceof HTMLLinkElement;
          if (assetFailed && !appStarted) void recoverOnce();
        }, true);

        window.addEventListener('unhandledrejection', () => {
          if (!appStarted) void recoverOnce();
        });

        window.setTimeout(async () => {
          if (appStarted) return;
          if (await recoverOnce()) return;
          showRecoveryError();
        }, 5500);
      })();
    </script>
  </head>

    <div id="root"></div>
