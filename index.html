<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7E2231">
<title>Тифліс · портал персоналу</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prata&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css?v=1">
<link rel="stylesheet" href="css/base.css?v=1">
<link rel="stylesheet" href="css/components.css?v=1">
<link rel="stylesheet" href="css/pages.css?v=1">
</head>
<body>

<!-- ЕКРАН ВХОДУ -->
<div id="login-screen" class="login hidden">
  <div class="login__card">
    <div class="login__brand">
      <div class="login__logo">Თ</div>
      <h1 class="login__title">Тифліс</h1>
      <p class="login__sub">портал персоналу · v2</p>
    </div>
    <form id="login-form" autocomplete="off">
      <label class="field">
        <span class="field__label">Ім'я</span>
        <input class="field__input" id="login-name" type="text" placeholder="Як у графіку" required>
      </label>
      <label class="field">
        <span class="field__label">PIN</span>
        <input class="field__input mono" id="login-pin" type="password" inputmode="numeric" placeholder="••••" required>
      </label>
      <button class="btn btn--primary btn--wide" id="login-btn" type="submit">Увійти</button>
      <p class="login__err" id="login-err"></p>
    </form>
    <div id="demo-hint" class="login__demo hidden"></div>
  </div>
</div>

<!-- ДОДАТОК -->
<div id="app" class="app hidden">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar__brand">
      <span class="sidebar__logo">Თ</span>
      <span class="sidebar__name">Тифліс</span>
    </div>
    <nav class="sidebar__nav" id="sidebar-nav"></nav>
    <div class="sidebar__foot">
      <button class="navbtn" id="theme-btn-side" title="Тема">◐ <span>Тема</span></button>
      <button class="navbtn navbtn--danger" id="logout-btn-side">⏻ <span>Вийти</span></button>
    </div>
  </aside>

  <main class="main" id="main">
    <header class="topbar" id="topbar">
      <div class="topbar__title" id="topbar-title"></div>
      <div class="topbar__user" id="topbar-user"></div>
    </header>
    <div class="page" id="page"></div>
  </main>

  <nav class="tabbar" id="tabbar"></nav>
</div>

<div id="modal-root"></div>
<div id="toast-root"></div>
<div id="sheet-root"></div>

<script src="config.js?v=1"></script>
<script src="js/lib/utils.js?v=1"></script>
<script src="js/lib/demo-data.js?v=1"></script>
<script src="js/lib/store.js?v=1"></script>
<script src="js/core/ui.js?v=1"></script>
<script src="js/core/acl.js?v=1"></script>
<script src="js/core/auth.js?v=1"></script>
<script src="js/core/router.js?v=1"></script>
<script src="js/pages/today.js?v=1"></script>
<script src="js/pages/schedule.js?v=1"></script>
<script src="js/pages/cash.js?v=1"></script>
<script src="js/pages/staff.js?v=1"></script>
<script src="js/pages/menu.js?v=1"></script>
<script src="js/pages/reserve.js?v=1"></script>
<script src="js/pages/admin.js?v=1"></script>
<script src="js/app.js?v=1"></script>
</body>
</html>
